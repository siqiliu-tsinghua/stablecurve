[project]
name = "sc-gwall"
version = "0.1.0"
description = "Local Gromov-Witten and BPS invariants of curves (Rust port of GWall)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/siqiliu-tsinghua/stablecurve"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "sc_gwall._sc_gwall"
features = ["pyo3/extension-module"]

# Rust 源码（含所依赖的内核 crate）变动时让 `uv sync` 重新构建扩展
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../sc-gwall/src/**/*.rs" },
    { file = "../sc-num/src/**/*.rs" },
    { file = "../../Cargo.lock" },
]
